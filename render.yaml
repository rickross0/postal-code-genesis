services:
  # ── PostgreSQL + PostGIS Database (private) ──
  - type: pserv
    name: postal-genesis-db
    plan: starter
    runtime: image
    image:
      url: postgis/postgis:15-3.4
    envVars:
      - key: POSTGRES_DB
        value: postal_genesis
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        sync: false
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # ── Combined Backend + Frontend ──
  - type: web
    name: postal-genesis
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromService:
          name: postal-genesis-db
          type: pserv
          property: connectionString
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
