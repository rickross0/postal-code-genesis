services:
  # ── PostgreSQL + PostGIS Database (private) ──
  - type: pserv
    name: postal-genesis-db
    plan: starter
    runtime: image
    image:
      url: postgis/postgis:15-3.4
    envVars:
      - key: POSTGRES_DB
        value: postal_genesis
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        sync: false

  # ── Combined Backend + Frontend ──
  - type: web
    name: postal-genesis
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: starter
    envVars:
      - key: DB_HOST
        fromService:
          name: postal-genesis-db
          type: pserv
          property: host
      - key: DB_PORT
        fromService:
          name: postal-genesis-db
          type: pserv
          property: port
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: postal_genesis
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
